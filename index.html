<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 overflow-hidden select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV News Broadcast Background Engine</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cyan: '#00f0ff',
                            red: '#ff1744',
                            gold: '#ffb700',
                            purple: '#9d4edd',
                        }
                    }
                }
            }
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #02040a;
        }

        /* Glassmorphism TV HUD Panels */
        .hud-panel {
            background: rgba(8, 15, 30, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        .hud-border {
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.15), 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Scanline Overlay */
        .tv-scanline {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.3) 50%,
                rgba(0, 0, 0, 0.3)
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Emergency Strobe Pulse */
        @keyframes strobe {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.35; }
        }
        .emergency-strobe {
            animation: strobe 0.6s infinite;
        }

        /* Glow utilities */
        .glow-cyan {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
        }
    </style>
</head>
<body class="h-full relative overflow-hidden bg-slate-950 flex items-center justify-center">

    <!-- MAIN BROADCAST VIEWPORT CONTAINER -->
    <div id="broadcastViewport" class="relative w-full h-full overflow-hidden transition-all duration-700 ease-in-out">

        <!-- 3D HIGH-TECH CANVAS STUDIO BACKGROUND -->
        <canvas id="studioBackgroundCanvas" class="absolute inset-0 w-full h-full object-cover z-0"></canvas>
        
        <!-- TV Scanline Effect Overlay -->
        <div class="absolute inset-0 tv-scanline z-10"></div>

        <!-- Emergency Flash Alert Light (Hidden by default) -->
        <div id="emergencyOverlay" class="absolute inset-0 bg-red-600 z-20 pointer-events-none opacity-0 transition-opacity duration-300"></div>

        <!-- CLEAN TEXTLESS BROADCAST GRAPHICS LAYER (OVERLAYS ONLY VISUAL HUD GEOMETRY) -->
        <div class="relative z-30 h-full flex flex-col justify-between p-4 sm:p-6 lg:p-8 pointer-events-none">

            <!-- TOP GRAPHIC BUG / SIGNAL INDICATOR (NO TEXT) -->
            <header class="flex items-center justify-between pointer-events-auto">
                <div class="hud-panel hud-border rounded-2xl p-3 flex items-center justify-center">
                    <div class="relative flex items-center justify-center w-9 h-9 rounded-xl bg-brand-cyan/20 border border-brand-cyan text-brand-cyan shadow-lg">
                        <i id="channelIcon" data-lucide="globe-2" class="w-5 h-5 animate-spin" style="animation-duration: 25s;"></i>
                        <span id="liveDot" class="absolute -top-1 -right-1 w-3 h-3 bg-brand-red rounded-full animate-ping"></span>
                    </div>
                </div>

                <!-- Signal Frequency Graphic Equalizer Bars -->
                <div class="hud-panel rounded-2xl px-4 py-3 flex items-center gap-1.5 h-12">
                    <div class="w-1 bg-brand-cyan h-3 animate-pulse"></div>
                    <div class="w-1 bg-brand-cyan h-6 animate-pulse" style="animation-delay: 0.15s"></div>
                    <div class="w-1 bg-brand-cyan h-2 animate-pulse" style="animation-delay: 0.3s"></div>
                    <div class="w-1 bg-brand-cyan h-5 animate-pulse" style="animation-delay: 0.45s"></div>
                    <div class="w-1 bg-brand-cyan h-4 animate-pulse" style="animation-delay: 0.6s"></div>
                </div>
            </header>

            <!-- MIDDLE SIDE PICTURE-IN-PICTURE FRAME -->
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center my-auto">
                <div class="hidden lg:block lg:col-start-10 lg:col-span-3 pointer-events-auto">
                    <div class="hud-panel hud-border rounded-2xl p-2.5">
                        <div class="relative aspect-video rounded-xl bg-slate-900/90 overflow-hidden border border-slate-800">
                            <canvas id="pipCanvas" class="w-full h-full object-cover"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- BOTTOM LOWER THIRD GRAPHIC BASE BAR -->
            <footer class="pointer-events-auto">
                <div id="lowerThirdBox" class="hud-panel hud-border rounded-2xl h-4 border-l-8 border-l-brand-cyan transition-all duration-500 glow-cyan"></div>
            </footer>

        </div>

    </div>

    <!-- MINIMAL FLOATING DIRECTOR CONTROL DECK -->
    <div id="directorDeck" class="fixed top-6 right-6 z-50 flex flex-col items-end">
        <button id="btnToggleDeck" title="Open Studio Controls" class="hud-panel rounded-2xl p-3.5 text-brand-cyan hover:text-white border border-brand-cyan/40 hover:border-brand-cyan transition-all shadow-2xl flex items-center justify-center">
            <i data-lucide="sliders" class="w-5 h-5"></i>
        </button>

        <!-- Collapsible Control Card -->
        <div id="deckPanel" class="hidden mt-3 w-56 hud-panel hud-border rounded-2xl p-4 space-y-3.5 border border-slate-700 shadow-2xl">
            
            <!-- Channel Switcher Button -->
            <div class="space-y-1">
                <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">TV News Channel</span>
                <button id="btnNextChannel" class="w-full h-10 rounded-xl bg-brand-cyan/20 border border-brand-cyan text-brand-cyan hover:bg-brand-cyan hover:text-slate-950 font-bold transition-all flex items-center justify-between px-3">
                    <span id="channelLabel" class="text-xs">1. WORLD GLOBE</span>
                    <i data-lucide="tv" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Orientation Toggle Button -->
            <div class="space-y-1">
                <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">Aspect Ratio</span>
                <button id="btnTogglePortrait" class="w-full h-10 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-brand-cyan transition-all flex items-center justify-between px-3">
                    <span id="aspectLabel" class="text-xs">16:9 Landscape</span>
                    <i id="aspectIcon" data-lucide="monitor" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Visual Color Theme Buttons -->
            <div class="space-y-1">
                <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">Studio Lighting</span>
                <div class="grid grid-cols-4 gap-2">
                    <button data-theme="cyan" class="theme-btn h-8 rounded-lg bg-brand-cyan/20 border border-brand-cyan text-brand-cyan flex items-center justify-center">
                        <span class="w-3 h-3 rounded-full bg-brand-cyan"></span>
                    </button>
                    <button data-theme="red" class="theme-btn h-8 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 hover:border-brand-red flex items-center justify-center">
                        <span class="w-3 h-3 rounded-full bg-brand-red"></span>
                    </button>
                    <button data-theme="gold" class="theme-btn h-8 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 hover:border-brand-gold flex items-center justify-center">
                        <span class="w-3 h-3 rounded-full bg-brand-gold"></span>
                    </button>
                    <button data-theme="purple" class="theme-btn h-8 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 hover:border-brand-purple flex items-center justify-center">
                        <span class="w-3 h-3 rounded-full bg-brand-purple"></span>
                    </button>
                </div>
            </div>

            <!-- Emergency Flash Alert Trigger -->
            <button id="btnEmergencyTrigger" class="w-full h-9 rounded-xl bg-brand-red/80 hover:bg-brand-red text-white font-semibold transition-all flex items-center justify-center gap-2 text-xs">
                <i data-lucide="bell-ring" class="w-4 h-4"></i>
                <span>ALERT STROBE</span>
            </button>
            
            <!-- Fullscreen Button -->
            <button id="btnFullscreen" class="w-full h-9 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white flex items-center justify-center gap-2 text-xs">
                <i data-lucide="maximize-2" class="w-4 h-4"></i>
                <span>FULLSCREEN</span>
            </button>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Web Audio Sound Engine (Synthesized TV Chimes)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playBeep(freq = 880, duration = 0.12, type = 'sine') {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // Ignore muted audio contexts
            }
        }

        // Canvas Setup
        const bgCanvas = document.getElementById('studioBackgroundCanvas');
        const ctx = bgCanvas.getContext('2d');
        const broadcastViewport = document.getElementById('broadcastViewport');

        function resizeCanvas() {
            bgCanvas.width = broadcastViewport.clientWidth;
            bgCanvas.height = broadcastViewport.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        // Pre-calculated Latitude / Longitude Continental Land Dots for 3D Earth Globe Rendering
        const worldLandDots = [];
        for (let lat = -60; lat <= 70; lat += 8) {
            for (let lon = -180; lon <= 180; lon += 10) {
                // Mathematical continental mask simulation
                const isLand = 
                    (lat > 15 && lat < 70 && lon > -130 && lon < -60) || // North America
                    (lat > -55 && lat < 10 && lon > -80 && lon < -35) ||  // South America
                    (lat > 35 && lat < 65 && lon > -10 && lon < 50) ||   // Europe
                    (lat > -35 && lat < 35 && lon > -20 && lon < 50) ||  // Africa
                    (lat > 5 && lat < 70 && lon > 60 && lon < 140) ||    // Asia
                    (lat > -40 && lat < -10 && lon > 110 && lon < 155);  // Australia

                if (isLand || Math.random() < 0.08) {
                    worldLandDots.push({
                        lat: (lat * Math.PI) / 180,
                        lon: (lon * Math.PI) / 180
                    });
                }
            }
        }

        // Background Particles
        const particles = [];
        for (let i = 0; i < 150; i++) {
            particles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                radius: Math.random() * 2 + 1,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
            });
        }

        let time = 0;
        let themeColor = '#00f0ff';
        let currentChannel = 0;

        // Channel Configurations
        const channelConfigs = [
            { id: 0, name: '1. WORLD GLOBE', color: '#00f0ff', icon: 'globe-2' },
            { id: 1, name: '2. BREAKING RED', color: '#ff1744', icon: 'zap' },
            { id: 2, name: '3. MARKETS GOLD', color: '#ffb700', icon: 'trending-up' },
            { id: 3, name: '4. CYBER TECH', color: '#9d4edd', icon: 'cpu' },
        ];

        // MAIN 3D TV STUDIO BACKGROUND ANIMATION LOOP
        function drawStudioBackground() {
            time += 0.012;
            const w = bgCanvas.width;
            const h = bgCanvas.height;

            // Deep Studio Lighting Backdrop Gradient
            const bgGradient = ctx.createRadialGradient(w / 2, h * 0.45, 50, w / 2, h / 2, Math.max(w, h));
            bgGradient.addColorStop(0, '#0a162e');
            bgGradient.addColorStop(0.5, '#030814');
            bgGradient.addColorStop(1, '#010206');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, w, h);

            // Studio Overhead Spotlight Beams
            ctx.save();
            ctx.globalAlpha = 0.08;
            ctx.fillStyle = themeColor;
            
            ctx.beginPath();
            ctx.moveTo(w * 0.2, 0);
            ctx.lineTo(w * 0.05, h);
            ctx.lineTo(w * 0.35, h);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(w * 0.8, 0);
            ctx.lineTo(w * 0.65, h);
            ctx.lineTo(w * 0.95, h);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Studio Perspective Floor Grid
            const horizon = h * 0.55;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;

            for (let x = -w; x < w * 2; x += 90) {
                ctx.beginPath();
                ctx.moveTo(x, h);
                ctx.lineTo(w / 2 + (x - w / 2) * 0.12, horizon);
                ctx.stroke();
            }

            for (let y = horizon; y < h; y += 22) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            }

            // CHANNEL SPECIFIC 3D GRAPHICS RENDERER
            ctx.save();
            ctx.translate(w / 2, horizon - 20);

            if (currentChannel === 0) {
                // CHANNEL 1: 3D ROTATING WORLD GLOBE WITH CONTINENT DOTS
                const sphereRadius = Math.min(w, h) * 0.28;
                const rot = time * 0.4;

                // Globe Telemetry Orbit Rings
                ctx.strokeStyle = themeColor;
                ctx.lineWidth = 1.5;
                for (let r = 0; r < 3; r++) {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, sphereRadius * (1.2 + r * 0.2), sphereRadius * 0.35, rot * 0.5 + r, 0, Math.PI * 2);
                    ctx.globalAlpha = 0.25 - r * 0.07;
                    ctx.stroke();
                }

                // Render 3D Projected Land Dots
                ctx.fillStyle = themeColor;
                worldLandDots.forEach(pt => {
                    const cosLat = Math.cos(pt.lat);
                    const sinLat = Math.sin(pt.lat);
                    const cosLon = Math.cos(pt.lon + rot);
                    const sinLon = Math.sin(pt.lon + rot);

                    // 3D Spherical Coordinates
                    const x3d = sphereRadius * cosLat * sinLon;
                    const y3d = sphereRadius * sinLat;
                    const z3d = sphereRadius * cosLat * cosLon;

                    // Front Hemisphere Visibility
                    if (z3d > 0) {
                        const alpha = (z3d / sphereRadius);
                        const scale = 0.8 + alpha * 0.6;
                        ctx.globalAlpha = alpha * 0.85;
                        ctx.beginPath();
                        ctx.arc(x3d, -y3d, 2.2 * scale, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

            } else if (currentChannel === 1) {
                // CHANNEL 2: BREAKING ALERT RED FLARE & RADAR PULSE
                const maxR = Math.min(w, h) * 0.32;
                ctx.strokeStyle = themeColor;
                ctx.lineWidth = 2;

                for (let r = 1; r <= 4; r++) {
                    ctx.beginPath();
                    ctx.arc(0, 0, (maxR / 4) * r, 0, Math.PI * 2);
                    ctx.globalAlpha = 0.18 * r;
                    ctx.stroke();
                }

                // Rotating Radar Scanner Beam
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, maxR, time * 2.5, time * 2.5 + 0.6);
                ctx.fillStyle = themeColor;
                ctx.globalAlpha = 0.25;
                ctx.fill();

                // Alert Wave Beacons
                const pulseR = (time * 120) % maxR;
                ctx.beginPath();
                ctx.arc(0, 0, pulseR, 0, Math.PI * 2);
                ctx.strokeStyle = themeColor;
                ctx.globalAlpha = 1 - (pulseR / maxR);
                ctx.stroke();

            } else if (currentChannel === 2) {
                // CHANNEL 3: FINANCIAL MARKETS 3D BARS & INDEX WAVES
                ctx.globalAlpha = 0.4;
                ctx.fillStyle = themeColor;

                const barCount = 32;
                const spacing = Math.min(w * 0.022, 28);
                const startX = -((barCount * spacing) / 2);

                for (let i = 0; i < barCount; i++) {
                    const hBar = Math.sin(time * 2.5 + i * 0.3) * 90 + 110;
                    const xPos = startX + i * spacing;
                    ctx.fillRect(xPos, -hBar / 2, spacing - 6, hBar);
                }

                // Financial Trend Wave Line
                ctx.beginPath();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.globalAlpha = 0.8;
                for (let i = 0; i < barCount; i++) {
                    const hBar = Math.sin(time * 2.5 + i * 0.3) * 90 + 110;
                    const xPos = startX + i * spacing + (spacing / 2);
                    const yPos = -hBar / 2 - 10;
                    i === 0 ? ctx.moveTo(xPos, yPos) : ctx.lineTo(xPos, yPos);
                }
                ctx.stroke();

            } else if (currentChannel === 3) {
                // CHANNEL 4: CYBER TECH HEXAGONAL HUD NETWORK
                ctx.globalAlpha = 0.35;
                ctx.strokeStyle = themeColor;
                ctx.lineWidth = 1.5;

                const hexSize = 50;
                for (let i = -3; i <= 3; i++) {
                    for (let j = -2; j <= 2; j++) {
                        const hx = i * hexSize * 1.7;
                        const hy = j * hexSize * 1.5 + (i % 2 === 0 ? 0 : hexSize * 0.75);
                        
                        ctx.beginPath();
                        for (let k = 0; k < 6; k++) {
                            const angle = (Math.PI / 3) * k + time * 0.15;
                            const px = hx + Math.cos(angle) * (hexSize + Math.sin(time + i) * 6);
                            const py = hy + Math.sin(angle) * (hexSize + Math.sin(time + j) * 6);
                            k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                        }
                        ctx.closePath();
                        ctx.stroke();
                    }
                }
            }

            ctx.restore();

            // Floating Ambient Dust Particles
            ctx.globalAlpha = 1;
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) p.x = w;
                if (p.x > w) p.x = 0;
                if (p.y < 0) p.y = h;
                if (p.y > h) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = themeColor;
                ctx.shadowBlur = 6;
                ctx.shadowColor = themeColor;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            requestAnimationFrame(drawStudioBackground);
        }

        // PIP Canvas Loop
        const pipCanvas = document.getElementById('pipCanvas');
        const pipCtx = pipCanvas.getContext('2d');

        function drawPip() {
            if (!pipCanvas.parentElement) return;
            pipCanvas.width = pipCanvas.parentElement.clientWidth;
            pipCanvas.height = pipCanvas.parentElement.clientHeight;
            const pw = pipCanvas.width;
            const ph = pipCanvas.height;

            pipCtx.fillStyle = '#020612';
            pipCtx.fillRect(0, 0, pw, ph);

            // Radar Circle in PIP Frame
            pipCtx.beginPath();
            pipCtx.arc(pw / 2, ph / 2, ph / 2.6, 0, Math.PI * 2);
            pipCtx.strokeStyle = themeColor;
            pipCtx.globalAlpha = 0.5;
            pipCtx.stroke();

            pipCtx.beginPath();
            pipCtx.moveTo(pw / 2, ph / 2);
            pipCtx.arc(pw / 2, ph / 2, ph / 2.6, time * 2, time * 2 + 0.6);
            pipCtx.fillStyle = themeColor;
            pipCtx.globalAlpha = 0.25;
            pipCtx.fill();

            requestAnimationFrame(drawPip);
        }

        // CONTROL PANEL INTERACTORS
        const btnToggleDeck = document.getElementById('btnToggleDeck');
        const deckPanel = document.getElementById('deckPanel');

        btnToggleDeck.addEventListener('click', () => {
            deckPanel.classList.toggle('hidden');
            playBeep(1200, 0.08);
        });

        // TV Channel Switcher
        const btnNextChannel = document.getElementById('btnNextChannel');
        const channelLabel = document.getElementById('channelLabel');

        btnNextChannel.addEventListener('click', () => {
            currentChannel = (currentChannel + 1) % channelConfigs.length;
            const cfg = channelConfigs[currentChannel];
            themeColor = cfg.color;
            channelLabel.innerText = cfg.name;

            // Update Lower Third glow color
            const lowerThirdBox = document.getElementById('lowerThirdBox');
            lowerThirdBox.style.borderColor = themeColor;
            lowerThirdBox.style.boxShadow = `0 0 25px ${themeColor}66`;

            playBeep(1400, 0.15);
        });

        // Portrait vs Widescreen Orientation Toggle
        const btnTogglePortrait = document.getElementById('btnTogglePortrait');
        const aspectLabel = document.getElementById('aspectLabel');
        let isPortrait = false;

        btnTogglePortrait.addEventListener('click', () => {
            isPortrait = !isPortrait;
            if (isPortrait) {
                broadcastViewport.className = "relative w-[380px] h-[675px] max-w-full max-h-screen rounded-3xl border-4 border-slate-800 shadow-2xl overflow-hidden transition-all duration-700 ease-in-out my-auto mx-auto";
                aspectLabel.innerText = "9:16 Portrait";
            } else {
                broadcastViewport.className = "relative w-full h-full overflow-hidden transition-all duration-700 ease-in-out";
                aspectLabel.innerText = "16:9 Landscape";
            }
            setTimeout(resizeCanvas, 350);
            playBeep(950, 0.1);
        });

        // Studio Theme Color Selector
        const themeMap = {
            cyan: '#00f0ff',
            red: '#ff1744',
            gold: '#ffb700',
            purple: '#9d4edd'
        };

        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tKey = btn.dataset.theme;
                if (themeMap[tKey]) {
                    themeColor = themeMap[tKey];
                    const lowerThirdBox = document.getElementById('lowerThirdBox');
                    lowerThirdBox.style.borderColor = themeColor;
                    lowerThirdBox.style.boxShadow = `0 0 25px ${themeColor}66`;
                    playBeep(1100, 0.1);
                }
            });
        });

        // Emergency Strobe Flash
        document.getElementById('btnEmergencyTrigger').addEventListener('click', () => {
            const overlay = document.getElementById('emergencyOverlay');
            overlay.classList.remove('opacity-0');
            overlay.classList.add('opacity-100', 'emergency-strobe');

            playBeep(523, 0.2, 'sawtooth');
            setTimeout(() => playBeep(659, 0.2, 'sawtooth'), 150);
            setTimeout(() => playBeep(783, 0.3, 'sawtooth'), 300);

            setTimeout(() => {
                overlay.classList.remove('opacity-100', 'emergency-strobe');
                overlay.classList.add('opacity-0');
            }, 3000);
        });

        // Fullscreen Toggle
        document.getElementById('btnFullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        // Start Animation Loops on Window Load
        window.onload = function() {
            resizeCanvas();
            drawStudioBackground();
            drawPip();
        };
    </script>
</body>
</html>
