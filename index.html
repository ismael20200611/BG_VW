<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 overflow-hidden select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real 3D Interactive Earth Studio</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Three.js Library for True 3D Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #010409;
        }

        .font-mono-tech {
            font-family: 'Space Grotesk', monospace;
        }

        /* Glassmorphism TV HUD Panels */
        .hud-panel {
            background: rgba(6, 12, 24, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        .hud-border {
            box-shadow: inset 0 0 25px rgba(0, 240, 255, 0.12), 0 12px 40px rgba(0, 0, 0, 0.75);
        }

        /* Custom Scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.4); border-radius: 6px; }
    </style>
</head>
<body class="h-full relative overflow-hidden bg-slate-950 flex items-center justify-center">

    <!-- MAIN VIEWPORT CONTAINER -->
    <div id="broadcastViewport" class="relative w-full h-full overflow-hidden cursor-grab active:cursor-grabbing">

        <!-- 3D THREE.JS CONTAINER -->
        <div id="webglContainer" class="absolute inset-0 w-full h-full z-0"></div>

        <!-- OVERLAY HUD LAYER -->
        <div id="hudLayer" class="relative z-30 h-full flex flex-col justify-between p-4 sm:p-8 pointer-events-none">

            <!-- TOP HEADER -->
            <header class="flex items-center justify-between pointer-events-auto">
                <div class="hud-panel hud-border rounded-2xl p-3 flex items-center gap-3">
                    <div class="relative flex items-center justify-center w-10 h-10 rounded-xl bg-cyan-500/20 border border-cyan-400 text-cyan-400">
                        <i data-lucide="globe" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="px-1.5 py-0.5 rounded text-[10px] font-black bg-red-600 text-white uppercase">REAL 3D</span>
                            <span class="text-xs sm:text-sm font-bold tracking-widest text-white uppercase font-mono-tech">EARTH GLOBE STUDIO</span>
                        </div>
                        <div class="text-[10px] font-medium text-slate-400 hidden sm:block">INTERACTIVE WEBGL GLOBE</div>
                    </div>
                </div>

                <div class="hud-panel hud-border rounded-2xl px-4 py-2.5 flex items-center gap-4 hidden sm:flex pointer-events-auto">
                    <div class="text-right font-mono-tech">
                        <div id="utcClock" class="text-xs font-bold text-cyan-400">00:00:00 UTC</div>
                        <div id="coordinatesText" class="text-[9px] text-slate-400">LAT: 33.3° N | LON: 44.3° E</div>
                    </div>
                </div>
            </header>

            <!-- BOTTOM LOWER THIRD & SELECTOR -->
            <footer class="pointer-events-auto space-y-3">

                <!-- COUNTRY INFO CARD -->
                <div class="hud-panel hud-border rounded-2xl p-4 flex items-center justify-between border-l-4 border-l-cyan-400 gap-3 shadow-2xl">
                    <div class="flex items-center gap-3">
                        <span id="targetFlag" class="text-3xl p-1 bg-slate-900 rounded-xl border border-slate-700">🇮🇶</span>
                        <div>
                            <div class="flex items-center gap-2">
                                <span id="targetCountryName" class="text-base sm:text-lg font-black text-white font-mono-tech">Iraq (عێراق)</span>
                                <span class="px-2 py-0.5 rounded text-[9px] font-black bg-cyan-500/20 text-cyan-400 border border-cyan-400 uppercase font-mono-tech">STATIC SELECTION</span>
                            </div>
                            <div id="targetDetails" class="text-xs text-slate-300 font-medium mt-0.5">
                                Capital: Baghdad • Middle East Region
                            </div>
                        </div>
                    </div>
                </div>

                <!-- BOTTOM HORIZONTAL STRIP -->
                <div class="hud-panel hud-border rounded-2xl p-2.5">
                    <div class="flex items-center justify-between px-2 pb-1.5 text-[10px] font-mono-tech font-bold text-slate-400 uppercase tracking-widest border-b border-slate-800 mb-2">
                        <span class="flex items-center gap-1.5 text-cyan-400">
                            <i data-lucide="map-pin" class="w-3 h-3"></i>
                            SELECT COUNTRY (NO AUTOMATIC CHANGE)
                        </span>
                    </div>

                    <div id="countryBar" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
                        <!-- Dynamically populated -->
                    </div>
                </div>

            </footer>

        </div>

    </div>

    <script>
        const featuredCountries = [
            { id: 'iq', name: 'Iraq (عێراق)', city: 'Baghdad', flag: '🇮🇶', lat: 33.3, lon: 44.3 },
            { id: 'us', name: 'United States', city: 'Washington D.C.', flag: '🇺🇸', lat: 38.9, lon: -77.0 },
            { id: 'gb', name: 'United Kingdom', city: 'London', flag: '🇬🇧', lat: 51.5, lon: -0.1 },
            { id: 'jp', name: 'Japan', city: 'Tokyo', flag: '🇯🇵', lat: 35.6, lon: 139.6 },
            { id: 'de', name: 'Germany', city: 'Berlin', flag: '🇩🇪', lat: 52.5, lon: 13.4 },
            { id: 'fr', name: 'France', city: 'Paris', flag: '🇫🇷', lat: 48.8, lon: 2.3 },
            { id: 'eg', name: 'Egypt', city: 'Cairo', flag: '🇪🇬', lat: 30.0, lon: 31.2 },
            { id: 'sa', name: 'Saudi Arabia', city: 'Riyadh', flag: '🇸🇦', lat: 24.7, lon: 46.7 },
            { id: 'tr', name: 'Turkey', city: 'Ankara', flag: '🇹🇷', lat: 39.9, lon: 32.8 }
        ];

        let currentCountryIdx = 0;

        // THREE.JS REAL 3D SETUP
        const container = document.getElementById('webglContainer');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 3.2;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 3D LIGHTING
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 3, 5);
        scene.add(dirLight);

        // REAL 3D EARTH SPHERE GEOMETRY
        const sphereGeometry = new THREE.SphereGeometry(1, 64, 64);
        const textureLoader = new THREE.TextureLoader();
        
        // Earth Texture Map
        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        
        const earthMaterial = new THREE.MeshPhongMaterial({
            map: earthTexture,
            shininess: 15
        });

        const earthMesh = new THREE.Mesh(sphereGeometry, earthMaterial);
        scene.add(earthMesh);

        // ATMOSPHERE GLOW
        const atmosGeometry = new THREE.SphereGeometry(1.03, 64, 64);
        const atmosMaterial = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            transparent: true,
            opacity: 0.15,
            side: THREE.BackSide
        });
        const atmosMesh = new THREE.Mesh(atmosGeometry, atmosMaterial);
        scene.add(atmosMesh);

        // TARGET ROTATION STATE
        let targetRotY = 0;
        let targetRotX = 0;

        function renderCountryBar() {
            const countryBar = document.getElementById('countryBar');
            countryBar.innerHTML = '';
            featuredCountries.forEach((c, idx) => {
                const isSelected = idx === currentCountryIdx;
                const btn = document.createElement('button');
                btn.className = `px-3 py-1.5 rounded-xl font-mono-tech text-xs font-bold transition-all flex items-center gap-2 shrink-0 ${
                    isSelected 
                    ? 'bg-cyan-400 text-slate-950 shadow-lg scale-105 border border-white' 
                    : 'bg-slate-900/90 text-slate-300 border border-slate-800 hover:border-cyan-400 hover:text-white'
                }`;
                btn.innerHTML = `<span>${c.flag}</span> <span>${c.name}</span>`;
                btn.onclick = () => selectCountry(idx);
                countryBar.appendChild(btn);
            });
        }

        function selectCountry(idx) {
            currentCountryIdx = idx;
            renderCountryBar();

            const c = featuredCountries[idx];
            document.getElementById('targetFlag').innerText = c.flag;
            document.getElementById('targetCountryName').innerText = c.name;
            document.getElementById('targetDetails').innerText = `Capital: ${c.city} • Lat: ${c.lat}° , Lon: ${c.lon}°`;

            // Convert Lat/Lon to 3D Sphere Euler Rotations
            targetRotY = -(c.lon * Math.PI / 180) - Math.PI / 2;
            targetRotX = (c.lat * Math.PI / 180);
        }

        // ANIMATION LOOP
        function animate() {
            requestAnimationFrame(animate);

            // Smooth Interpolation to selected country (No auto cycling!)
            earthMesh.rotation.y += (targetRotY - earthMesh.rotation.y) * 0.05;
            earthMesh.rotation.x += (targetRotX - earthMesh.rotation.x) * 0.05;

            // Clock update
            document.getElementById('utcClock').innerText = new Date().toISOString().substr(11, 8) + ' UTC';

            renderer.render(scene, camera);
        }

        // RESIZE LISTENER
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = () => {
            lucide.createIcons();
            renderCountryBar();
            selectCountry(0); // Default to Iraq
            animate();
        };
    </script>
</body>
</html>
