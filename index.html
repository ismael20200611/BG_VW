
<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 overflow-hidden select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV News Broadcast Background Engine</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cyan: '#00f0ff',
                            red: '#ff1744',
                            gold: '#ffb700',
                            purple: '#9d4edd',
                        }
                    }
                }
            }
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #02040a;
        }

        /* Glassmorphism TV HUD Panels */
        .hud-panel {
            background: rgba(8, 15, 30, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        .hud-border {
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.15), 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Scanline Overlay */
        .tv-scanline {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.3) 50%,
                rgba(0, 0, 0, 0.3)
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Emergency Strobe Pulse */
        @keyframes strobe {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.35; }
        }
        .emergency-strobe {
            animation: strobe 0.6s infinite;
        }

        /* Glow utilities */
        .glow-cyan {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
        }
    </style>
</head>
<body class="h-full relative overflow-hidden bg-slate-950 flex items-center justify-center">

    <!-- MAIN BROADCAST VIEWPORT CONTAINER -->
    <div id="broadcastViewport" class="relative w-full h-full overflow-hidden transition-all duration-700 ease-in-out">

        <!-- 3D HIGH-TECH CANVAS STUDIO BACKGROUND -->
        <canvas id="studioBackgroundCanvas" class="absolute inset-0 w-full h-full object-cover z-0"></canvas>
        
        <!-- TV Scanline Effect Overlay -->
        <div class="absolute inset-0 tv-scanline z-10"></div>

        <!-- Emergency Flash Alert Light (Hidden by default) -->
        <div id="emergencyOverlay" class="absolute inset-0 bg-red-600 z-20 pointer-events-none opacity-0 transition-opacity duration-300"></div>

        <!-- CLEAN TEXTLESS BROADCAST GRAPHICS LAYER (OVERLAYS ONLY VISUAL HUD GEOMETRY) -->
        <div class="relative z-30 h-full flex flex-col justify-between p-4 sm:p-6 lg:p-8 pointer-events-none">

            <!-- TOP GRAPHIC BUG / SIGNAL INDICATOR (NO TEXT) -->
            <header class="flex items-center justify-between pointer-events-auto">
                <div class="hud-panel hud-border rounded-2xl p-3 flex items-center justify-center">
                    <div class="relative flex items-center justify-center w-9 h-9 rounded-xl bg-brand-cyan/20 border border-brand-cyan text-brand-cyan shadow-lg">
                        <i id="channelIcon" data-lucide="globe-2" class="w-5 h-5 animate-spin" style="animation-duration: 25s;"></i>
                        <span id="liveDot" class="absolute -top-1 -right-1 w-3 h-3 bg-brand-red rounded-full animate-ping"></span>
                    </div>
                </div>

                <!-- Signal Frequency Graphic Equalizer Bars -->
                <div class="hud-panel rounded-2xl px-4 py-3 flex items-center gap-1.5 h-12">
                    <div class="w-1 bg-brand-cyan h-3 animate-pulse"></div>
                    <div class="w-1 bg-brand-cyan h-6 animate-pulse" style="animation-delay: 0.15s"></div>
                    <div class="w-1 bg-brand-cyan h-2 animate-pulse" style="animation-delay: 0.3s"></div>
                    <div class="w-1 bg-brand-cyan h-5 animate-pulse" style="animation-delay: 0.45s"></div>
                    <div class="w-1 bg-brand-cyan h-4 animate-pulse" style="animation-delay: 0.6s"></div>
                </div>
            </header>

            <!-- MIDDLE SIDE PICTURE-IN-PICTURE FRAME -->
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center my-auto">
                <div class="hidden lg:block lg:col-start-10 lg:col-span-3 pointer-events-auto">
                    <div class="hud-panel hud-border rounded-2xl p-2.5">
                        <div class="relative aspect-video rounded-xl bg-slate-900/90 overflow-hidden border border-slate-800">
                            <canvas id="pipCanvas" class="w-full h-full object-cover"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- BOTTOM LOWER THIRD GRAPHIC BASE BAR -->
            <footer class="pointer-events-auto">
                <div id="lowerThirdBox" class="hud-panel hud-border rounded-2xl h-4 border-l-8 border-l-brand-cyan transition-all duration-500 glow-cyan"></div>
            </footer>

        </div>

    </div>

    <!-- AUTO-HIDING DISCREET STUDIO CONTROL DECK (FADES OUT ON IDLE FOR CLEAN TV BROADCAST) -->
    <div id="directorDeck" class="fixed top-4 right-4 z-50 flex flex-col items-end opacity-0 hover:opacity-100 transition-opacity duration-500">
        <button id="btnToggleDeck" title="Studio Controls (Auto-Hides)" class="hud-panel rounded-xl p-2.5 text-brand-cyan/70 hover:text-white border border-brand-cyan/30 hover:border-brand-cyan transition-all shadow-xl flex items-center gap-2 text-xs">
            <i data-lucide="settings" class="w-4 h-4"></i>
            <span class="text-[10px] uppercase tracking-wider font-semibold">Studio Controls</span>
        </button>

        <!-- Collapsible Control Card -->
        <div id="deckPanel" class="hidden mt-2 w-56 hud-panel hud-border rounded-2xl p-4 space-y-3.5 border border-slate-700 shadow-2xl">
            
            <!-- Channel Switcher Button -->
            <div class="space-y-1">
                <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">TV News Channel</span>
                <button id="btnNextChannel" class="w-full h-10 rounded-xl bg-brand-cyan/20 border border-brand-cyan text-brand-cyan hover:bg-brand-cyan hover:text-slate-950 font-bold transition-all flex items-center justify-between px-3">
                    <span id="channelLabel" class="text-xs">1. WORLD GLOBE</span>
                    <i data-lucide="tv" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Orientation Toggle Button -->
            <div class="space-y-1">
                <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">Aspect Ratio</span>
                <button id="btnTogglePortrait" class="w-full h-10 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-brand-cyan transition-all flex items-center justify-between px-3">
                    <span id="aspectLabel" class="text-xs">16:9 Landscape</span>
                    <i id="aspectIcon" data-lucide="monitor" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Visual Color Theme Buttons -->
            <div class="space-y-1">
                <div class="flex items-center justify-between">
                    <span class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">Studio Lighting & Tint</span>
                    <input type="color" id="customColorPicker" value="#00f0ff" title="Choose Custom Color" class="w-5 h-5 rounded cursor-pointer border-0 bg-transparent">
                </div>
                <!-- Extended Color Palette Presets -->
                <div class="grid grid-cols-5 gap-1.5 pt-1">
                    <button data-color="#00f0ff" title="Electric Cyan" class="theme-btn h-7 rounded-md bg-slate-900 border border-cyan-400/50 hover:scale-105 transition-transform flex items-center justify-center">
                        <span class="w-3 h-3 rounded-full bg-[#00f0ff]"></span>
                    </button>
                    <button data-color="#ff1744" title="Breaking Red" class="theme-btn h-7 rounded-md bg-slate-900 border border-red-500/50 hover:scale-105 transition-transform flex items-center justify-center">
                        <span class="w-3 h-3 rounded-full bg-[#ff1744]"></span>
                    </button>
                    <button data-color="#ffb700" title="Market Gold" class="theme-btn h-7 rounded-md bg-slate-900 border border-amber-400/50 hover:scale-105 transition-transform flex items-center justify-center">
                        <span class="w-3 h-3 rounded-full bg-[#ffb700]"></span>
                    </button>
                    <button data-color="#9d4edd" title="Cyber Purple" class="theme-btn h-7 rounded-md bg-slate-900 border border-purple-400/50 hover:scale-105 transition-transform flex items-center justify-center">
                        <span class="w-3 h-3 rounded-full bg-[#9d4edd]"></span>
                    </button>
                    <button data-color="#00e676" title="Emerald Green" class="theme-btn h-7 rounded-md bg-slate-900 border border-emerald-400/50 hover:scale-105 transition-transform flex items-center justify-center">
                        <span class="w-3 h-3 rounded-full bg-[#00e676]"></span>
                    </button>
                    <button data-color="#ff9100" title="Sunset Orange" class="theme-btn h-7 rounded-md bg-slate-900 border border-orange-400/50 hover:scale-105 transition-transform flex items-center justify-center">
                        <span class="w-3 h-3 rounded-full bg-[#ff9100]"></span>
                    </button>
                    <button data-color="#f50057" title="Neon Magenta" class="theme-btn h-7 rounded-md bg-slate-900 border border-pink-500/50 hover:scale-105 transition-transform flex items-center justify-center">
                        <span class="w-3 h-3 rounded-full bg-[#f50057]"></span>
                    </button>
                    <button data-color="#1de9b6" title="Vibrant Teal" class="theme-btn h-7 rounded-md bg-slate-900 border border-teal-300/50 hover:scale-105 transition-transform flex items-center justify-center">
                        <span class="w-3 h-3 rounded-full bg-[#1de9b6]"></span>
                    </button>
                    <button data-color="#29b6f6" title="Sky Blue" class="theme-btn h-7 rounded-md bg-slate-900 border border-sky-400/50 hover:scale-105 transition-transform flex items-center justify-center">
                        <span class="w-3 h-3 rounded-full bg-[#29b6f6]"></span>
                    </button>
                    <button data-color="#e0e0e0" title="Studio Silver" class="theme-btn h-7 rounded-md bg-slate-900 border border-slate-300/50 hover:scale-105 transition-transform flex items-center justify-center">
                        <span class="w-3 h-3 rounded-full bg-[#e0e0e0]"></span>
                    </button>
                </div>
            </div>

            <!-- Emergency Flash Alert Trigger -->
            <button id="btnEmergencyTrigger" class="w-full h-9 rounded-xl bg-brand-red/80 hover:bg-brand-red text-white font-semibold transition-all flex items-center justify-center gap-2 text-xs">
                <i data-lucide="bell-ring" class="w-4 h-4"></i>
                <span>ALERT STROBE</span>
            </button>
            
            <!-- Fullscreen Button -->
            <button id="btnFullscreen" class="w-full h-9 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white flex items-center justify-center gap-2 text-xs">
                <i data-lucide="maximize-2" class="w-4 h-4"></i>
                <span>FULLSCREEN</span>
            </button>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Web Audio Sound Engine (Synthesized TV Chimes)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playBeep(freq = 880, duration = 0.12, type = 'sine') {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        // Canvas Setup
        const bgCanvas = document.getElementById('studioBackgroundCanvas');
        const ctx = bgCanvas.getContext('2d');
        const broadcastViewport = document.getElementById('broadcastViewport');

        function resizeCanvas() {
            bgCanvas.width = broadcastViewport.clientWidth;
            bgCanvas.height = broadcastViewport.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        // Featured Countries Database for Animated Target Focus
        const featuredCountries = [
            { name: "JAPAN", city: "TOKYO", lat: 35.6, lon: 139.6, status: "ASIA BROADCAST" },
            { name: "UNITED STATES", city: "WASHINGTON D.C.", lat: 38.9, lon: -77.0, status: "NORTH AMERICA" },
            { name: "IRAQ", city: "BAGHDAD", lat: 33.3, lon: 44.3, status: "MIDDLE EAST HUB" },
            { name: "UNITED KINGDOM", city: "LONDON", lat: 51.5, lon: -0.1, status: "EUROPE DESK" },
            { name: "EGYPT", city: "CAIRO", lat: 30.0, lon: 31.2, status: "NORTH AFRICA" },
            { name: "BRAZIL", city: "RIO DE JANEIRO", lat: -22.9, lon: -43.1, status: "SOUTH AMERICA" },
            { name: "CHINA", city: "BEIJING", lat: 39.9, lon: 116.4, status: "EAST ASIA" },
            { name: "AUSTRALIA", city: "SYDNEY", lat: -33.8, lon: 151.2, status: "OCEANIA FEED" },
            { name: "GERMANY", city: "BERLIN", lat: 52.5, lon: 13.4, status: "CENTRAL EUROPE" },
            { name: "UNITED ARAB EMIRATES", city: "DUBAI", lat: 25.2, lon: 55.2, status: "GULF BUREAU" },
            { name: "FRANCE", city: "PARIS", lat: 48.8, lon: 2.3, status: "EU MONITOR" }
        ];

        // 3D Globe Camera and Focus State Controller
        let currentRotY = 0;
        let currentRotX = 0;
        let targetRotY = 0;
        let targetRotX = 0;
        
        let focusState = 'ROTATING'; // 'ROTATING' | 'LOCKING' | 'HOLDING' | 'UNLOCKING'
        let currentCountryIdx = 0;
        let focusTimer = 0;
        let nextFocusTime = 260; // Frames between country targets (~4.5s)
        let holdDuration = 120;  // Holds spotlight for ~2.0 seconds (60fps * 2)

        // Pre-calculated Latitude / Longitude Continental Land Dots for 3D Earth Globe Rendering
        const worldLandDots = [];
        for (let lat = -60; lat <= 70; lat += 6) {
            for (let lon = -180; lon <= 180; lon += 8) {
                const isLand = 
                    (lat > 15 && lat < 70 && lon > -130 && lon < -60) || // North America
                    (lat > -55 && lat < 10 && lon > -80 && lon < -35) ||  // South America
                    (lat > 35 && lat < 65 && lon > -10 && lon < 50) ||   // Europe
                    (lat > -35 && lat < 35 && lon > -20 && lon < 50) ||  // Africa
                    (lat > 5 && lat < 70 && lon > 60 && lon < 140) ||    // Asia
                    (lat > -40 && lat < -10 && lon > 110 && lon < 155);  // Australia

                if (isLand || Math.random() < 0.06) {
                    worldLandDots.push({
                        lat: (lat * Math.PI) / 180,
                        lon: (lon * Math.PI) / 180
                    });
                }
            }
        }

        // Ambient particles
        const particles = [];
        for (let i = 0; i < 180; i++) {
            particles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                radius: Math.random() * 2 + 0.8,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
            });
        }

        let time = 0;
        let themeColor = '#00f0ff';
        let currentChannel = 0;

        // Channel Configurations
        const channelConfigs = [
            { id: 0, name: '1. WORLD NEWS 3D', color: '#00f0ff' },
            { id: 1, name: '2. BREAKING ALERT', color: '#ff1744' },
            { id: 2, name: '3. GLOBAL MARKETS', color: '#ffb700' },
            { id: 3, name: '4. CYBER TECH GRID', color: '#9d4edd' },
        ];

        // Convert Hex to RGB for Canvas Alpha Blending
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 240, b: 255 };
        }

        function setStudioThemeColor(colorHex) {
            themeColor = colorHex;
            const lowerThirdBox = document.getElementById('lowerThirdBox');
            const channelIcon = document.getElementById('channelIcon');
            
            lowerThirdBox.style.borderColor = themeColor;
            lowerThirdBox.style.boxShadow = `0 0 25px ${themeColor}66`;
            if (channelIcon && channelIcon.parentElement) {
                channelIcon.parentElement.style.borderColor = themeColor;
                channelIcon.parentElement.style.color = themeColor;
            }
        }

        // HIGH-END AUTHENTIC TV NEWS BROADCAST BACKGROUND ENGINE
        function drawStudioBackground() {
            time += 0.012;
            const w = bgCanvas.width;
            const h = bgCanvas.height;
            const rgb = hexToRgb(themeColor);

            // 1. DEEP TV STUDIO ATMOSPHERIC GRADIENT
            const bgGradient = ctx.createRadialGradient(w * 0.5, h * 0.4, 40, w * 0.5, h * 0.5, Math.max(w, h));
            bgGradient.addColorStop(0, `rgba(${Math.floor(rgb.r * 0.25)}, ${Math.floor(rgb.g * 0.25)}, ${Math.floor(rgb.b * 0.35)}, 1)`);
            bgGradient.addColorStop(0.55, '#030814');
            bgGradient.addColorStop(1, '#010206');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, w, h);

            // 2. CURVED TV STUDIO NEWSROOM BACKDROP WALL GRID
            ctx.save();
            ctx.strokeStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.08)`;
            ctx.lineWidth = 1;

            const centerY = h * 0.45;
            for (let r = 100; r <= Math.max(w, h) * 0.9; r += 70) {
                ctx.beginPath();
                ctx.ellipse(w / 2, centerY, r * 1.4, r * 0.45, 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Radial studio wall pillars
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 10) {
                ctx.beginPath();
                ctx.moveTo(w / 2, centerY);
                ctx.lineTo(w / 2 + Math.cos(a) * w, centerY + Math.sin(a) * h * 0.7);
                ctx.stroke();
            }
            ctx.restore();

            // 3. SWEEPING BROADCAST LIGHT BEAMS & LENS FLARES
            ctx.save();
            const beamX1 = w * 0.5 + Math.sin(time * 0.5) * (w * 0.3);
            const beamGrad = ctx.createRadialGradient(beamX1, h * 0.3, 10, beamX1, h * 0.3, w * 0.6);
            beamGrad.addColorStop(0, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.25)`);
            beamGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = beamGrad;
            ctx.beginPath();
            ctx.arc(beamX1, h * 0.3, w * 0.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 4. 3D NEWSROOM GRAPHIC ELEMENT IN CENTER
            ctx.save();
            ctx.translate(w / 2, h * 0.45);

            if (currentChannel === 0 || currentChannel === 1) {
                // UPDATE GLOBE ROTATION & COUNTRY LOCK STATE MACHINE
                focusTimer++;

                if (focusState === 'ROTATING') {
                    currentRotY += 0.006;
                    currentRotX += (0 - currentRotX) * 0.05;

                    if (focusTimer > nextFocusTime) {
                        focusState = 'LOCKING';
                        focusTimer = 0;
                        
                        // Select target country
                        const country = featuredCountries[currentCountryIdx];
                        // Target angles to align selected country straight facing the viewer
                        targetRotY = - (country.lon * Math.PI / 180) - Math.PI / 2;
                        targetRotX = (country.lat * Math.PI / 180) * 0.75;
                        
                        playBeep(1200, 0.08);
                    }
                } else if (focusState === 'LOCKING') {
                    // Smoothly ease rotation toward country coordinates
                    let diffY = (targetRotY - currentRotY) % (Math.PI * 2);
                    if (diffY > Math.PI) diffY -= Math.PI * 2;
                    if (diffY < -Math.PI) diffY += Math.PI * 2;

                    currentRotY += diffY * 0.08;
                    currentRotX += (targetRotX - currentRotX) * 0.08;

                    if (Math.abs(diffY) < 0.015 && Math.abs(targetRotX - currentRotX) < 0.015) {
                        focusState = 'HOLDING';
                        focusTimer = 0;
                        playBeep(1500, 0.15, 'sine');
                        setTimeout(() => playBeep(2000, 0.18, 'sine'), 100);
                    }
                } else if (focusState === 'HOLDING') {
                    // Micro ambient drift during 2-second hold
                    currentRotY += 0.0005;

                    if (focusTimer > holdDuration) {
                        focusState = 'ROTATING';
                        focusTimer = 0;
                        currentCountryIdx = (currentCountryIdx + 1) % featuredCountries.length;
                    }
                }

                // GLOBE 3D RENDERING
                const globeR = Math.min(w, h) * 0.28;
                const cosRotX = Math.cos(currentRotX);
                const sinRotX = Math.sin(currentRotX);

                // Latitude & Longitude Wireframe Grid Lines
                ctx.strokeStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.25)`;
                ctx.lineWidth = 1;

                // Latitude rings with 3D tilt
                for (let latDeg = -60; latDeg <= 60; latDeg += 20) {
                    const latRad = (latDeg * Math.PI) / 180;
                    const rLat = globeR * Math.cos(latRad);
                    const yLat = globeR * Math.sin(latRad);

                    ctx.beginPath();
                    ctx.ellipse(0, -yLat * cosRotX, rLat, rLat * 0.3 * cosRotX, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Longitude meridians
                for (let lonDeg = 0; lonDeg < 180; lonDeg += 30) {
                    const lonRad = (lonDeg * Math.PI) / 180 + currentRotY;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, globeR * Math.cos(lonRad), globeR * cosRotX, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Sweeping Equator Orbit Ring
                ctx.strokeStyle = themeColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(0, 0, globeR * 1.35, globeR * 0.38 * cosRotX, -0.2, 0, Math.PI * 2);
                ctx.stroke();

                // Pulsing Orbital Satellites
                for (let s = 0; s < 3; s++) {
                    const satAngle = time * (0.8 + s * 0.3) + s * 2.1;
                    const sx = Math.cos(satAngle) * (globeR * 1.35);
                    const sy = Math.sin(satAngle) * (globeR * 0.38) * cosRotX;
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(sx, sy, 3.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = themeColor;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(sx, sy, 8 + Math.sin(time * 6 + s) * 4, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Continent Map Dot Matrix with 3D Projection & Tilt
                ctx.fillStyle = themeColor;
                worldLandDots.forEach(pt => {
                    const cosLat = Math.cos(pt.lat);
                    const sinLat = Math.sin(pt.lat);
                    const cosLon = Math.cos(pt.lon + currentRotY);
                    const sinLon = Math.sin(pt.lon + currentRotY);

                    // 3D Sphere coordinates
                    const x3d = globeR * cosLat * sinLon;
                    const y3d_raw = globeR * sinLat;
                    const z3d_raw = globeR * cosLat * cosLon;

                    // Apply X-axis tilt
                    const y3d = y3d_raw * cosRotX - z3d_raw * sinRotX;
                    const z3d = y3d_raw * sinRotX + z3d_raw * cosRotX;

                    if (z3d > 0) {
                        const alpha = z3d / globeR;
                        ctx.globalAlpha = alpha * 0.9;
                        ctx.beginPath();
                        ctx.arc(x3d, -y3d, 2.3 * (0.8 + alpha * 0.5), 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                // DRAW TARGETED COUNTRY SPOTLIGHT HUD & FLOATING 3D CALLOUT BADGE
                if (focusState === 'HOLDING' || focusState === 'LOCKING') {
                    const country = featuredCountries[currentCountryIdx];
                    const cLatRad = (country.lat * Math.PI) / 180;
                    const cLonRad = (country.lon * Math.PI) / 180;

                    const cosLat = Math.cos(cLatRad);
                    const sinLat = Math.sin(cLatRad);
                    const cosLon = Math.cos(cLonRad + currentRotY);
                    const sinLon = Math.sin(cLonRad + currentRotY);

                    const x3d = globeR * cosLat * sinLon;
                    const y3d_raw = globeR * sinLat;
                    const z3d_raw = globeR * cosLat * cosLon;

                    const y3d = y3d_raw * cosRotX - z3d_raw * sinRotX;
                    const z3d = y3d_raw * sinRotX + z3d_raw * cosRotX;

                    if (z3d > 0) {
                        const spotX = x3d;
                        const spotY = -y3d;

                        // Pulsing Target Lock Reticle
                        const pulse = (Math.sin(time * 12) + 1) * 0.5;
                        ctx.save();
                        ctx.globalAlpha = 1.0;

                        // Outer radar scanning ring
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(spotX, spotY, 18 + pulse * 8, 0, Math.PI * 2);
                        ctx.stroke();

                        // Inner target glow
                        ctx.fillStyle = themeColor;
                        ctx.beginPath();
                        ctx.arc(spotX, spotY, 6, 0, Math.PI * 2);
                        ctx.fill();

                        // Crosshair lines
                        ctx.strokeStyle = themeColor;
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(spotX - 28, spotY); ctx.lineTo(spotX - 10, spotY);
                        ctx.moveTo(spotX + 10, spotY); ctx.lineTo(spotX + 28, spotY);
                        ctx.moveTo(spotX, spotY - 28); ctx.lineTo(spotX, spotY - 10);
                        ctx.moveTo(spotX, spotY + 10); ctx.lineTo(spotX, spotY + 28);
                        ctx.stroke();

                        // Laser Pointer Line to Floating Glass HUD Badge
                        const badgeX = spotX + (spotX > 0 ? 90 : -210);
                        const badgeY = spotY - 70;

                        ctx.strokeStyle = themeColor;
                        ctx.lineWidth = 1.5;
                        ctx.setLineDash([4, 4]);
                        ctx.beginPath();
                        ctx.moveTo(spotX, spotY);
                        ctx.lineTo(spotX + (spotX > 0 ? 40 : -40), spotY - 30);
                        ctx.lineTo(badgeX + (spotX > 0 ? 0 : 200), badgeY + 30);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        // Floating Glassmorphism Country Name Callout Badge
                        const bWidth = 210;
                        const bHeight = 72;

                        ctx.fillStyle = 'rgba(8, 15, 30, 0.85)';
                        ctx.strokeStyle = themeColor;
                        ctx.lineWidth = 1.5;

                        // Badge background container
                        ctx.beginPath();
                        ctx.roundRect(badgeX, badgeY, bWidth, bHeight, 10);
                        ctx.fill();
                        ctx.stroke();

                        // Badge Neon Header Bar
                        ctx.fillStyle = themeColor;
                        ctx.beginPath();
                        ctx.roundRect(badgeX + 2, badgeY + 2, bWidth - 4, 18, [8, 8, 0, 0]);
                        ctx.fill();

                        // Badge Header Text
                        ctx.fillStyle = '#020612';
                        ctx.font = '900 10px Inter, sans-serif';
                        ctx.fillText(`● TARGET LOCKED: ${country.status}`, badgeX + 10, badgeY + 14);

                        // Country Name
                        ctx.fillStyle = '#ffffff';
                        ctx.font = '800 15px Inter, sans-serif';
                        ctx.fillText(country.name, badgeX + 12, badgeY + 40);

                        // Capital City & Coordinates
                        ctx.fillStyle = themeColor;
                        ctx.font = '600 11px Inter, sans-serif';
                        const latStr = `${Math.abs(country.lat).toFixed(1)}°${country.lat >= 0 ? 'N' : 'S'}`;
                        const lonStr = `${Math.abs(country.lon).toFixed(1)}°${country.lon >= 0 ? 'E' : 'W'}`;
                        ctx.fillText(`${country.city} [ ${latStr}, ${lonStr} ]`, badgeX + 12, badgeY + 58);

                        ctx.restore();
                    }
                }

            } else if (currentChannel === 2) {
                // FINANCIAL MARKETS BAR & INDEX CHART WAVE
                const barCount = 36;
                const spacing = Math.min(w * 0.02, 26);
                const startX = -((barCount * spacing) / 2);

                ctx.fillStyle = themeColor;
                for (let i = 0; i < barCount; i++) {
                    const hBar = Math.sin(time * 2.2 + i * 0.25) * 85 + 100;
                    const xPos = startX + i * spacing;
                    ctx.globalAlpha = 0.35;
                    ctx.fillRect(xPos, -hBar / 2, spacing - 5, hBar);
                }

                ctx.beginPath();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.globalAlpha = 0.9;
                for (let i = 0; i < barCount; i++) {
                    const hBar = Math.sin(time * 2.2 + i * 0.25) * 85 + 100;
                    const xPos = startX + i * spacing + (spacing / 2);
                    const yPos = -hBar / 2 - 8;
                    i === 0 ? ctx.moveTo(xPos, yPos) : ctx.lineTo(xPos, yPos);
                }
                ctx.stroke();

            } else if (currentChannel === 3) {
                // CYBER NETWORK TECH MESH
                const hexR = 45;
                ctx.strokeStyle = themeColor;
                ctx.lineWidth = 1.2;

                for (let i = -4; i <= 4; i++) {
                    for (let j = -2; j <= 2; j++) {
                        const hx = i * hexR * 1.6;
                        const hy = j * hexR * 1.4 + (i % 2 === 0 ? 0 : hexR * 0.7);

                        ctx.beginPath();
                        ctx.globalAlpha = 0.25 + Math.sin(time * 2 + i + j) * 0.15;
                        for (let k = 0; k < 6; k++) {
                            const angle = (Math.PI / 3) * k + time * 0.1;
                            const px = hx + Math.cos(angle) * hexR;
                            const py = hy + Math.sin(angle) * hexR;
                            k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                        }
                        ctx.closePath();
                        ctx.stroke();
                    }
                }
            }

            ctx.restore();

            // 5. HIGH-TECH REFLECTIVE STUDIO PERSPECTIVE FLOOR GRID
            const floorY = h * 0.58;
            ctx.save();
            ctx.strokeStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.12)`;
            ctx.lineWidth = 1;

            for (let x = -w; x < w * 2; x += 80) {
                ctx.beginPath();
                ctx.moveTo(x, h);
                ctx.lineTo(w / 2 + (x - w / 2) * 0.15, floorY);
                ctx.stroke();
            }

            for (let y = floorY; y < h; y += 20) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            }
            ctx.restore();

            // 6. FLOATING DUST & BROADCAST PARTICLES
            ctx.globalAlpha = 1;
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) p.x = w;
                if (p.x > w) p.x = 0;
                if (p.y < 0) p.y = h;
                if (p.y > h) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = themeColor;
                ctx.shadowBlur = 8;
                ctx.shadowColor = themeColor;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            requestAnimationFrame(drawStudioBackground);
        }

        // PIP Canvas Loop
        const pipCanvas = document.getElementById('pipCanvas');
        const pipCtx = pipCanvas.getContext('2d');

        function drawPip() {
            if (!pipCanvas.parentElement) return;
            pipCanvas.width = pipCanvas.parentElement.clientWidth;
            pipCanvas.height = pipCanvas.parentElement.clientHeight;
            const pw = pipCanvas.width;
            const ph = pipCanvas.height;

            pipCtx.fillStyle = '#020612';
            pipCtx.fillRect(0, 0, pw, ph);

            pipCtx.beginPath();
            pipCtx.arc(pw / 2, ph / 2, ph / 2.6, 0, Math.PI * 2);
            pipCtx.strokeStyle = themeColor;
            pipCtx.globalAlpha = 0.5;
            pipCtx.stroke();

            pipCtx.beginPath();
            pipCtx.moveTo(pw / 2, ph / 2);
            pipCtx.arc(pw / 2, ph / 2, ph / 2.6, time * 2, time * 2 + 0.6);
            pipCtx.fillStyle = themeColor;
            pipCtx.globalAlpha = 0.25;
            pipCtx.fill();

            requestAnimationFrame(drawPip);
        }

        // CONTROL PANEL INTERACTORS
        const btnToggleDeck = document.getElementById('btnToggleDeck');
        const deckPanel = document.getElementById('deckPanel');

        btnToggleDeck.addEventListener('click', () => {
            deckPanel.classList.toggle('hidden');
            playBeep(1200, 0.08);
        });

        // TV Channel Switcher
        const btnNextChannel = document.getElementById('btnNextChannel');
        const channelLabel = document.getElementById('channelLabel');

        btnNextChannel.addEventListener('click', () => {
            currentChannel = (currentChannel + 1) % channelConfigs.length;
            const cfg = channelConfigs[currentChannel];
            channelLabel.innerText = cfg.name;
            setStudioThemeColor(cfg.color);
            playBeep(1400, 0.15);
        });

        // Custom Color Picker Listener
        const customColorPicker = document.getElementById('customColorPicker');
        customColorPicker.addEventListener('input', (e) => {
            setStudioThemeColor(e.target.value);
        });

        // Studio Theme Color Button Listeners
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const color = btn.dataset.color;
                if (color) {
                    setStudioThemeColor(color);
                    customColorPicker.value = color;
                    playBeep(1100, 0.1);
                }
            });
        });

        // Portrait vs Widescreen Orientation Toggle
        const btnTogglePortrait = document.getElementById('btnTogglePortrait');
        const aspectLabel = document.getElementById('aspectLabel');
        let isPortrait = false;

        btnTogglePortrait.addEventListener('click', () => {
            isPortrait = !isPortrait;
            if (isPortrait) {
                broadcastViewport.className = "relative w-[380px] h-[675px] max-w-full max-h-screen rounded-3xl border-4 border-slate-800 shadow-2xl overflow-hidden transition-all duration-700 ease-in-out my-auto mx-auto";
                aspectLabel.innerText = "9:16 Portrait";
            } else {
                broadcastViewport.className = "relative w-full h-full overflow-hidden transition-all duration-700 ease-in-out";
                aspectLabel.innerText = "16:9 Landscape";
            }
            setTimeout(resizeCanvas, 350);
            playBeep(950, 0.1);
        });

        // Emergency Strobe Flash
        document.getElementById('btnEmergencyTrigger').addEventListener('click', () => {
            const overlay = document.getElementById('emergencyOverlay');
            overlay.classList.remove('opacity-0');
            overlay.classList.add('opacity-100', 'emergency-strobe');

            playBeep(523, 0.2, 'sawtooth');
            setTimeout(() => playBeep(659, 0.2, 'sawtooth'), 150);
            setTimeout(() => playBeep(783, 0.3, 'sawtooth'), 300);

            setTimeout(() => {
                overlay.classList.remove('opacity-100', 'emergency-strobe');
                overlay.classList.add('opacity-0');
            }, 3000);
        });

        // Fullscreen Toggle
        document.getElementById('btnFullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        // Auto-Hide Controls on Mouse Inactivity for Clean TV Broadcast Screen
        const directorDeck = document.getElementById('directorDeck');
        let hideControlsTimeout = null;

        function showControlsTemporarily() {
            directorDeck.classList.remove('opacity-0');
            directorDeck.classList.add('opacity-100');
            
            clearTimeout(hideControlsTimeout);
            hideControlsTimeout = setTimeout(() => {
                if (deckPanel.classList.contains('hidden')) {
                    directorDeck.classList.remove('opacity-100');
                    directorDeck.classList.add('opacity-0');
                }
            }, 2500);
        }

        window.addEventListener('mousemove', showControlsTemporarily);
        window.addEventListener('touchstart', showControlsTemporarily);

        // Start Animation Loops on Window Load
        window.onload = function() {
            resizeCanvas();
            drawStudioBackground();
            drawPip();
            showControlsTemporarily();
        };
    </script>
</body>
</html>
